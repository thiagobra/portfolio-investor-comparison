<!-- Suggestion box: opens GitHub issue prefilled -->
<section class="section">
  <div class="section-title">💡 Got a Suggestion?</div>
  <div class="card">
    <p class="section-hint">Ideas make this project better. Send yours straight to the GitHub issue tracker — no account juggling, just type and submit.</p>
    <div class="suggestion-form">
      <input type="text" id="suggestion-title" placeholder="Short title (e.g. 'Add dark-light toggle')" maxlength="256">
      <textarea id="suggestion-body" rows="4" placeholder="What should we build or fix? Be as specific as you can." maxlength="2000"></textarea>
      <button class="btn btn-primary" id="btn-submit-suggestion">📤 Open on GitHub</button>
    </div>
  </div>
</section>
