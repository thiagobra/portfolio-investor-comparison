<!-- Sector Allocation (optional user input vs investor) -->
<section class="section">
  <div class="section-title">🏭 Sector Allocation (within Equities)</div>
  <p class="section-hint">Optional. Split your equities across sectors (sum to 100%) to unlock a sector-level similarity score. If left blank, we'll just show <span class="investor-name-inline" id="sector-investor-label"></span>'s drilldown.</p>
  <div class="card">
    <div class="grid-2" id="sector-form">
      <div class="input-group">
        <label for="sector-technology">Technology</label>
        <input type="number" id="sector-technology" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="sector-financials">Financials</label>
        <input type="number" id="sector-financials" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="sector-consumer">Consumer</label>
        <input type="number" id="sector-consumer" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="sector-healthcare">Healthcare</label>
        <input type="number" id="sector-healthcare" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="sector-energy">Energy</label>
        <input type="number" id="sector-energy" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="sector-industrials">Industrials</label>
        <input type="number" id="sector-industrials" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="sector-other">Other</label>
        <input type="number" id="sector-other" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
    </div>
    <div class="total-row">
      <span class="total-value" id="sector-total-display">Total: 0%</span>
    </div>
  </div>

  <div class="sector-grid">
    <div class="sector-panel" id="sector-drilldown-panel">
      <div class="sector-panel-title">🏭 <span id="sector-drilldown-investor-label"></span>'s Sector Drilldown</div>
      <div class="card" id="sector-drilldown"></div>
    </div>
    <div class="sector-panel hidden" id="sector-fit-panel">
      <div class="sector-panel-title">🎯 Your Sector Fit</div>
      <div class="card">
        <div class="score-container">
          <div class="score-number" id="sector-score-value">0%</div>
          <div class="score-label">sector alignment with <span id="sector-score-investor-name"></span></div>
          <div class="score-bar-track">
            <div class="score-bar-fill" id="sector-score-bar" style="width: 0%"></div>
          </div>
        </div>
        <div id="sector-comparison"></div>
      </div>
    </div>
  </div>
</section>
