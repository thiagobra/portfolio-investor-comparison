<!-- Industry Allocation (optional user input vs investor) -->
<section class="section">
  <div class="section-title">🏗️ Industry Allocation</div>
  <p class="section-hint">Optional. Split your equities across industries (sum to 100%) to compare against <span class="investor-name-inline" id="industry-investor-label"></span>'s industry breakdown.</p>
  <div class="card">
    <div class="grid-2" id="industry-form">
      <div class="input-group">
        <label for="industry-semiconductors">Semiconductors</label>
        <input type="number" id="industry-semiconductors" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-pharmaceuticals">Pharmaceuticals</label>
        <input type="number" id="industry-pharmaceuticals" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-finance">Finance</label>
        <input type="number" id="industry-finance" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-software">Software</label>
        <input type="number" id="industry-software" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-internet-software">Internet/Software Services</label>
        <input type="number" id="industry-internet-software" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-medical-specialties">Medical Specialties</label>
        <input type="number" id="industry-medical-specialties" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-banks">Banks</label>
        <input type="number" id="industry-banks" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-telecom-equipment">Telecom Equipment</label>
        <input type="number" id="industry-telecom-equipment" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-industrial-machinery">Industrial Machinery</label>
        <input type="number" id="industry-industrial-machinery" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-biotechnology">Biotechnology</label>
        <input type="number" id="industry-biotechnology" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
      <div class="input-group">
        <label for="industry-other">Other</label>
        <input type="number" id="industry-other" min="0" max="100" step="1" value="" placeholder="0">
        <span class="suffix">%</span>
      </div>
    </div>
    <div class="total-row">
      <span class="total-value" id="industry-total-display">Total: 0%</span>
    </div>
    <div id="industry-allocation"></div>
  </div>
</section>
